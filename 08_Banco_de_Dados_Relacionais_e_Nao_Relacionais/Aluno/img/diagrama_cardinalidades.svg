<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 850 170" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:850px;height:auto;display:block;margin:10px auto 24px;font-family:'Segoe UI',Arial,sans-serif;">
      <text x="130" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#CC0000">1 : 1</text>
      <rect x="30" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
      <text x="80" y="70" text-anchor="middle" fill="#fff" font-size="12">Filial</text>
      <rect x="170" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
      <text x="220" y="70" text-anchor="middle" fill="#fff" font-size="12">Endereço</text>
      <line x1="130" y1="65" x2="170" y2="65" stroke="#1a1a2e" stroke-width="2"/>
      <text x="140" y="58" font-size="13" fill="#1a1a2e" font-weight="bold">1</text>
      <text x="158" y="58" font-size="13" fill="#1a1a2e" font-weight="bold">1</text>
      <text x="130" y="120" text-anchor="middle" font-size="11.5" fill="#555">Uma Filial tem</text>
      <text x="130" y="135" text-anchor="middle" font-size="11.5" fill="#555">só 1 Endereço</text>

      <text x="410" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#CC0000">1 : N</text>
      <rect x="310" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
      <text x="360" y="70" text-anchor="middle" fill="#fff" font-size="12">Cliente</text>
      <rect x="450" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
