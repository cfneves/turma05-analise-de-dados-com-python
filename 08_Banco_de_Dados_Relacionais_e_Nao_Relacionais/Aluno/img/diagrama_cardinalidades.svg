      <line x1="410" y1="65" x2="450" y2="65" stroke="#1a1a2e" stroke-width="2"/>
      <text x="418" y="58" font-size="13" fill="#1a1a2e" font-weight="bold">1</text>
      <line x1="450" y1="65" x2="435" y2="55" stroke="#1a1a2e" stroke-width="2"/>
      <line x1="450" y1="65" x2="435" y2="75" stroke="#1a1a2e" stroke-width="2"/>
      <text x="425" y="52" font-size="13" fill="#1a1a2e" font-weight="bold">N</text>
      <text x="410" y="120" text-anchor="middle" font-size="11.5" fill="#555">Um Cliente faz</text>
      <text x="410" y="135" text-anchor="middle" font-size="11.5" fill="#555">vários Pedidos</text>

      <text x="690" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#CC0000">N : N</text>
      <rect x="590" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
      <text x="640" y="70" text-anchor="middle" fill="#fff" font-size="12">Filial</text>
      <rect x="730" y="40" width="100" height="50" rx="4" fill="#1a1a2e"/>
      <text x="780" y="70" text-anchor="middle" fill="#fff" font-size="12">Fornecedor</text>
      <line x1="690" y1="65" x2="710" y2="65" stroke="#1a1a2e" stroke-width="2"/>
      <line x1="690" y1="65" x2="708" y2="55" stroke="#1a1a2e" stroke-width="2"/>
      <line x1="690" y1="65" x2="708" y2="75" stroke="#1a1a2e" stroke-width="2"/>
      <line x1="730" y1="65" x2="710" y2="65" stroke="#1a1a2e" stroke-width="2"/>
